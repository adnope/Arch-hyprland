$font = Jetbrains Mono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0)

    outer_color = rgb(939AB7)
    check_color = rgb(64, 131, 199)
    fail_color = rgb(bf616a)
    
    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3
    hide_input = true

    position = 0, -17%
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    font_size = 90
    font_family = $font

    position = 0, 23%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, 16%
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/Arch-hyprland/assets/wallpapers/bird-avt.png
    size = 250
    rounding = -1

    position = 0, 3%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 30
    font_family = $font

    position = 0, -9%
    halign = center
    valign = center
}